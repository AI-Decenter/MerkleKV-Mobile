name: windows-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        shell: bash
        run: flutter config --enable-windows-desktop

      - name: Install 7-Zip
        shell: powershell
        run: choco install -y 7zip

      - name: Build portable EXE
        shell: pwsh
        run: |
          & ./scripts/windows/make-sfx.ps1

      - name: Find built EXE
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/flutter_demo/releases/windows" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "No EXE found in releases folder" }
          echo "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Windows Portable ${{ inputs.tag }}
          body: ${{ inputs.notes }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.find_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
